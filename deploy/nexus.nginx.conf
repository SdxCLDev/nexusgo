# Bloque "location" para agregar al server{} existente de
# amddev.sodexhochile.cl (ver el archivo de sitio real cuando lo compartas).
#
# El "/" al final de proxy_pass hace que nginx elimine el prefijo /nexus/
# antes de reenviar a Nexus -- Nexus sigue sirviendo todo desde la raiz
# internamente (no necesita saber que esta detras de un sub-path), y usa
# NEXUS_PUBLIC_BASE_PATH=/nexus (ver nexus.env.example) solo para construir
# las URLs absolutas que devuelve en sus respuestas (status_url, result_url,
# /docs, /openapi.json) de forma que funcionen a traves de este proxy.

location /nexus/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Los jobs asincronos (docs/05-patron-asincrono.md) pueden tardar mas
    # que el timeout por defecto de nginx -- se amplia por las dudas.
    proxy_read_timeout 120s;
}
